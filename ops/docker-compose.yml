# Snake Backlink Forge — local dev infra
# Usage: docker compose -f ops/docker-compose.yml up -d --wait
# Requires POSTGRES_PASSWORD and REDIS_PASSWORD in the local shell or env file.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sbf_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-sbf_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sbf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbf} -d ${POSTGRES_DB:-sbf_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sbf_redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - sbf_redisdata:/data
    command: ["sh", "-c", "umask 077; printf 'appendonly yes\nappendfsync everysec\nrequirepass %s\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf; exec redis-server /tmp/redis.conf"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  sbf_pgdata:
  sbf_redisdata:
