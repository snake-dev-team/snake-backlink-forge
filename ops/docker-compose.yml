# Snake Backlink Forge — local dev infra
# Usage: docker compose -f ops/docker-compose.yml up -d --wait
# Credentials match defaults in services/api/.env.example

services:
  postgres:
    image: postgres:16-alpine
    container_name: sbf_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbf}
      POSTGRES_DB: ${POSTGRES_DB:-sbf_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sbf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sbf} -d ${POSTGRES_DB:-sbf_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sbf_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - sbf_redisdata:/data
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  sbf_pgdata:
  sbf_redisdata:
