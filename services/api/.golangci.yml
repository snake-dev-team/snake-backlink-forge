# golangci-lint configuration — compatible with v2+
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  # Only lint files in this module (exclude vendor if present).
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - govet        # Detect suspicious constructs (shadowing, printf misuse, etc.)
    - unused       # Report unused exported symbols (replaces deadcode)
    - ineffassign  # Detect ineffectual assignments
    - unconvert    # Remove unnecessary type conversions

linters-settings:
  revive:
    rules:
      # Disable unused-parameter noise during Phase 1 scaffolding.
      # Remove this override once all handler signatures are finalized.
      - name: unused-parameter
        disabled: true

  gosec:
    # G304 (file path injection) and G401/G501 (weak crypto) are acceptable
    # for health-endpoint scaffold; re-enable when file I/O or crypto is added.
    excludes:
      - G304
      - G401
      - G501

issues:
  # Don't fail on generated files (sqlc output in Phase 03+).
  exclude-rules:
    - path: internal/db/sqlc/
      linters:
        - govet
        - errcheck
        - unused
